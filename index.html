<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>課題ダッシュボード</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{background:#f7f8fa}</style>
</head>
<body>
<div class="container py-3">
  <h1 class="mb-2">課題ダッシュボード</h1>
  <div class="d-flex gap-2 flex-wrap mb-2">
    <button id="reload" class="btn btn-outline-primary">更新</button>
    <a class="btn btn-outline-secondary" href="out/assignments.csv">CSV</a>
    <a class="btn btn-outline-secondary" href="out/assignments.ics">カレンダー(ICS)</a>
  </div>
  <p id="updated" class="text-muted">読み込み中…</p>
  <div id="list" class="list-group"></div>
</div>

<script>
function fmt(ts){
  if(!ts) return "（未記載）";
  const d = new Date(ts*1000);
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,"0"),
        day = String(d.getDate()).padStart(2,"0"),
        h = String(d.getHours()).padStart(2,"0"),
        min = String(d.getMinutes()).padStart(2,"0");
  return `${y}/${m}/${day} ${h}:${min}`;
}

function render(rows){
  rows.sort((a,b)=>(a.due_ts||2**31)-(b.due_ts||2**31));
  const list = document.getElementById("list");
  list.innerHTML = "";
  for(const r of rows){
    const d = document.createElement("div");
    d.className="list-group-item";
    d.innerHTML = `
      <div class="d-flex w-100 justify-content-between">
        <h5 class="mb-1">${r.title}</h5>
        <small class="text-secondary">${r.source}</small>
      </div>
      <p class="mb-1 text-secondary">${r.course}</p>
      <small>期限: ${r.due_raw || fmt(r.due_ts)}</small>`;
    list.appendChild(d);
  }
  document.getElementById("updated").textContent = "最終更新: " + new Date().toLocaleString();
}

async function load(noCache=false){
  const url = "out/assignments.json" + (noCache ? ("?ts="+Date.now()) : "");
  const res = await fetch(url, {cache: noCache ? "no-store" : "default"});
  const rows = await res.json();
  render(rows);
}

document.getElementById("reload").onclick = ()=>load(true);
load();
</script>
</body>
</html>
